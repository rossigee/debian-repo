name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    # Stays on a GitHub-hosted runner until self-hosted runners exist. A tag push
    # is a trusted event and is the right place for self-hosted capacity, but
    # pointing this at a label with no registered runner queues the release
    # silently forever. See the note in build.yaml for the intended split.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27.1'

      - name: Extract version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          # Version tags are always v-prefixed, so a tag created without the
          # "v" still produces a correctly named image rather than a stray
          # un-prefixed tag.
          case "$VERSION" in
            v*) ;;
            *) VERSION="v$VERSION" ;;
          esac

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "COMMIT=$COMMIT" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV

      - name: Verify tag matches VERSION file
        run: |
          if [ "${{ env.VERSION }}" != "v$(cat VERSION)" ]; then
            echo "❌ Tag version does not match VERSION file"
            echo "   tag:    ${{ env.VERSION }}"
            echo "   VERSION: v$(cat VERSION)"
            exit 1
          fi

      - name: Build release binaries
        run: |
          mkdir -p build/releases

          # Build debian-repo
          CGO_ENABLED=0 go build \
            -ldflags "-X git.golder.lan/rossgolderltd/debian-repo/internal/version.Version=${{ env.VERSION }} \
                      -X git.golder.lan/rossgolderltd/debian-repo/internal/version.Commit=${{ env.COMMIT }} \
                      -X git.golder.lan/rossgolderltd/debian-repo/internal/version.Date=${{ env.DATE }}" \
            -o build/releases/debian-repo \
            ./cmd/debian-repo

          # Build repoctl
          CGO_ENABLED=0 go build \
            -ldflags "-X git.golder.lan/rossgolderltd/debian-repo/internal/version.Version=${{ env.VERSION }} \
                      -X git.golder.lan/rossgolderltd/debian-repo/internal/version.Commit=${{ env.COMMIT }} \
                      -X git.golder.lan/rossgolderltd/debian-repo/internal/version.Date=${{ env.DATE }}" \
            -o build/releases/repoctl \
            ./cmd/repoctl

          # Create checksums
          cd build/releases
          sha256sum * > SHA256SUMS
          sha1sum * > SHA1SUMS

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg COMMIT=${{ env.COMMIT }} \
            --build-arg DATE=${{ env.DATE }} \
            -t ghcr.io/rossigee/debian-repo:latest \
            -t ghcr.io/rossigee/debian-repo:${{ env.VERSION }} \
            .

      - name: Run Trivy security scan
        continue-on-error: true
        run: |
          echo "Trivy scanning (vulnerabilities reported via Dependabot)"
          timeout 30 curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.48.0 || true
          timeout 60 trivy fs \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --no-progress \
            . || echo "Trivy scan completed or timed out"

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login \
            -u "${{ github.actor }}" \
            --password-stdin ghcr.io

      - name: Push Docker images to registry
        run: |
          # Version tags are the sole responsibility of this workflow. The
          # sha-<commit> tag is published by build.yaml on every master push and
          # must not be written here: pushing a tag this job never created fails
          # with "tag does not exist", and re-tagging it here would have two
          # workflows fighting over the same tag.
          docker push ghcr.io/rossigee/debian-repo:latest
          docker push ghcr.io/rossigee/debian-repo:${{ env.VERSION }}

      - name: Create GitHub release
        run: |
          # Create release with artifacts
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "tag_name": "${{ env.VERSION }}",
              "name": "Release ${{ env.VERSION }}",
              "body": "## Release ${{ env.VERSION }}\n\nBuilt on: ${{ env.DATE }}\nCommit: ${{ env.COMMIT }}\n\n### Changes\nSee commit history for details.\n\n### Docker Image\n```\ndocker pull ghcr.io/rossigee/debian-repo:${{ env.VERSION }}\n```",
              "draft": false,
              "prerelease": false
            }' \
            https://api.github.com/repos/rossigee/debian-repo/releases || true

      - name: Upload release binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ env.VERSION }}
          path: build/releases/
          retention-days: 90
