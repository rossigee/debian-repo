name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27.1'

      - name: Run gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "❌ Go files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m ./...

      - name: Check for secrets
        run: |
          # Check for common secret patterns in modified files (excluding .github/workflows)
          modified_files=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -v '\.github/workflows/' | tr '\n' ' ')
          if [ -n "$modified_files" ] && [ "$modified_files" != " " ]; then
            has_secrets=$(git show HEAD -- $modified_files 2>/dev/null | grep -E 'SIGNING_KEY_PASSPHRASE|AWS_SECRET|MINIO_SECRET' | grep -v '^diff ' | grep -v '^index ' | grep -v '^---' | grep -v '^+++' || true)
            if [ -n "$has_secrets" ]; then
              echo "❌ Potential secrets detected in commit:"
              echo "$has_secrets"
              exit 1
            fi
          fi

      - name: Check for GPG/credential files
        run: |
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -E '\.(asc|gpg|key|pem)$'; then
            echo "❌ Cryptographic keys detected in commit"
            exit 1
          fi
