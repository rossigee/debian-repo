name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27.1'

      - name: Inject version info
        run: |
          VERSION=$(cat VERSION)
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "COMMIT=$COMMIT" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV

      - name: Build binaries
        run: |
          mkdir -p build

          # Build debian-repo
          CGO_ENABLED=0 go build \
            -ldflags "-X git.golder.lan/rossgolderltd/debian-repo/internal/version.Version=${{ env.VERSION }} \
                      -X git.golder.lan/rossgolderltd/debian-repo/internal/version.Commit=${{ env.COMMIT }} \
                      -X git.golder.lan/rossgolderltd/debian-repo/internal/version.Date=${{ env.DATE }}" \
            -o build/debian-repo \
            ./cmd/debian-repo

          # Build repoctl
          CGO_ENABLED=0 go build \
            -ldflags "-X git.golder.lan/rossgolderltd/debian-repo/internal/version.Version=${{ env.VERSION }} \
                      -X git.golder.lan/rossgolderltd/debian-repo/internal/version.Commit=${{ env.COMMIT }} \
                      -X git.golder.lan/rossgolderltd/debian-repo/internal/version.Date=${{ env.DATE }}" \
            -o build/repoctl \
            ./cmd/repoctl

      - name: Run tests
        run: go test -race -v -coverprofile=build/coverage.txt ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/coverage.txt
          retention-days: 30

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg COMMIT=${{ env.COMMIT }} \
            --build-arg DATE=${{ env.DATE }} \
            -t ghcr.io/rossigee/debian-repo:latest \
            -t ghcr.io/rossigee/debian-repo:${{ env.VERSION }} \
            .

      - name: Run Trivy security scan
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.48.0
          trivy fs \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --no-progress \
            .

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login \
            -u "${{ github.actor }}" \
            --password-stdin ghcr.io

      - name: Push Docker image to GitHub Container Registry
        run: |
          docker push ghcr.io/rossigee/debian-repo:latest
          docker push ghcr.io/rossigee/debian-repo:${{ env.VERSION }}
