name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    # Runs on GitHub-hosted runners deliberately.
    #
    # This job runs for pull_request, which means it executes contributor-supplied
    # code. On a self-hosted runner that is arbitrary code execution on our own
    # hardware, with that runner's network access and persistent workspace. Public
    # repositories get unlimited free standard Linux runners, so isolation here is
    # free — take it.
    #
    # The intended split, once self-hosted runners are registered under the label
    # `trusted`:
    #   pull_request      -> ubuntu-latest                        (untrusted)
    #   push to master    -> [self-hosted, linux, x64, trusted]   (trusted)
    #   release.yaml tags -> [self-hosted, linux, x64, trusted]   (trusted)
    # Do not move the master push onto a self-hosted label until a runner matching
    # it is actually registered, or the job will queue forever with no failure.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27.1'

      - name: Inject version info
        run: |
          VERSION=$(cat VERSION)
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "COMMIT=$COMMIT" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV

      - name: Build binaries
        run: |
          mkdir -p build

          # Build debian-repo
          CGO_ENABLED=0 go build \
            -ldflags "-X git.golder.lan/rossgolderltd/debian-repo/internal/version.Version=${{ env.VERSION }} \
                      -X git.golder.lan/rossgolderltd/debian-repo/internal/version.Commit=${{ env.COMMIT }} \
                      -X git.golder.lan/rossgolderltd/debian-repo/internal/version.Date=${{ env.DATE }}" \
            -o build/debian-repo \
            ./cmd/debian-repo

          # Build repoctl
          CGO_ENABLED=0 go build \
            -ldflags "-X git.golder.lan/rossgolderltd/debian-repo/internal/version.Version=${{ env.VERSION }} \
                      -X git.golder.lan/rossgolderltd/debian-repo/internal/version.Commit=${{ env.COMMIT }} \
                      -X git.golder.lan/rossgolderltd/debian-repo/internal/version.Date=${{ env.DATE }}" \
            -o build/repoctl \
            ./cmd/repoctl

      - name: Run tests
        run: go test -race -v -coverprofile=build/coverage.txt ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/coverage.txt
          retention-days: 30

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-arg COMMIT=${{ env.COMMIT }} \
            --build-arg DATE=${{ env.DATE }} \
            -t ghcr.io/rossigee/debian-repo:latest \
            -t ghcr.io/rossigee/debian-repo:sha-${{ env.COMMIT }} \
            .

      - name: Run Trivy security scan
        continue-on-error: true
        run: |
          echo "Trivy scanning (vulnerabilities reported via Dependabot)"
          timeout 30 curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.48.0 || true
          timeout 60 trivy fs \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --no-progress \
            . || echo "Trivy scan completed or timed out"

      # Publish on master pushes, but never from a pull request: this workflow
      # also runs for pull_request, and an unconditional push lets any branch
      # overwrite :latest, which is the tag the deployed service tracks.
      #
      # Version tags are deliberately NOT pushed here. This workflow used to push
      # :${{ env.VERSION }} from the VERSION file, which collided with the
      # :v${{ env.VERSION }} that release.yaml derives from the git tag: the two
      # differed only by the "v" prefix, and a master push would overwrite the
      # release's version tag with an unrelated build. Releases are now the sole
      # owner of version tags. Master builds are traceable by commit instead.
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login \
            -u "${{ github.actor }}" \
            --password-stdin ghcr.io

      - name: Push Docker image to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/rossigee/debian-repo:latest
          docker push ghcr.io/rossigee/debian-repo:sha-${{ env.COMMIT }}

