		tcp dport 179 accept
		tcp sport 179 accept
		udp dport { 3784, 4784 } accept
		udp sport { 3784, 4784 } accept
		tcp sport { 5671, 5672, 15671, 15672, 15692 } accept
		icmp type { echo-reply, destination-unreachable, echo-request, time-exceeded, parameter-problem } accept
		limit rate 60/minute burst 20 packets log prefix "nftables-dropped-output: "
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		meta l4proto icmp accept
		ct state established,related accept
		iifname "br-*" accept
		oifname "br-*" accept
		iifname "wg+" accept
		oifname "wg+" accept
	}
}
