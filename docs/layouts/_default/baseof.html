<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} | {{ .Site.Title }}</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8f8f8;
      --text: #1a1a1a;
      --text-muted: #666;
      --border: #ddd;
      --accent: #0066cc;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1a1a1a;
        --surface: #2a2a2a;
        --text: #e8e8e8;
        --text-muted: #999;
        --border: #444;
        --accent: #66b3ff;
      }
    }

    :root[data-theme="dark"] {
      --bg: #1a1a1a;
      --surface: #2a2a2a;
      --text: #e8e8e8;
      --text-muted: #999;
      --border: #444;
      --accent: #66b3ff;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      line-height: 1.7;
      transition: background-color 0.3s, color 0.3s;
    }

    main { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; overflow-x: auto; }

    h1 { font-size: 2rem; font-weight: 700; margin: 2rem 0 1rem 0; padding-bottom: 0.5rem; border-bottom: 2px solid var(--accent); }
    h2 { font-size: 1.5rem; font-weight: 600; margin: 1.5rem 0 0.8rem 0; padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); }
    h3 { font-size: 1.1rem; font-weight: 600; margin: 1.2rem 0 0.6rem 0; }

    p { margin: 1rem 0; }

    table {
      border-collapse: collapse;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    th {
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      border: 1px solid var(--border);
      padding: 0.75rem;
      text-align: left;
    }

    td {
      border: 1px solid var(--border);
      padding: 0.75rem;
    }

    tbody tr:nth-child(odd) {
      background: rgba(0, 0, 0, 0.02);
    }

    @media (prefers-color-scheme: dark) {
      tbody tr:nth-child(odd) {
        background: rgba(255, 255, 255, 0.05);
      }
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 0.9rem;
      background: var(--surface);
      color: var(--text);
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
    }

    pre {
      background: var(--surface);
      color: var(--text);
      padding: 1rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      line-height: 1.4;
    }

    pre code {
      background: none;
      padding: 0;
      border-radius: 0;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: opacity 0.2s;
    }

    a:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      margin: 0;
      padding: 1rem;
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      padding: 0.5rem 0;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s;
    }

    nav a:hover {
      border-bottom-color: var(--accent);
      opacity: 1;
    }

    nav a.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    footer {
      margin-top: 3rem;
      padding: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
    }

    footer a { color: var(--accent); }

    @media (max-width: 768px) {
      main { padding: 1rem 0.75rem; }
      nav { flex-direction: column; gap: 0.5rem; }
      h1 { font-size: 1.5rem; }
      h2 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="{{ "" | relURL }}" {{ if eq .Section "" }}class="active"{{ end }}>Home</a>
    <a href="{{ "getting-started/" | relURL }}" {{ if eq .Section "getting-started" }}class="active"{{ end }}>Getting Started</a>
    <a href="{{ "user-guide/" | relURL }}" {{ if eq .Section "user-guide" }}class="active"{{ end }}>User Guide</a>
    <a href="{{ "admin-guide/" | relURL }}" {{ if eq .Section "admin-guide" }}class="active"{{ end }}>Admin Guide</a>
    <a href="{{ "api/" | relURL }}" {{ if eq .Section "api" }}class="active"{{ end }}>API</a>
  </nav>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    Last updated: {{ now.Format "2006-01-02" }} | <a href="https://git.golder.lan/rossgolderltd/debian-repo">debian-repo</a>
  </footer>
</body>
</html>
